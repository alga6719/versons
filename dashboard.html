<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>TrendIQ v2.7 Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    body{font-family:Arial;margin:18px;background:#f6f8fa;color:#111}
    header{display:flex;align-items:center;justify-content:space-between}
    #controls{margin:10px 0}
    #main{display:flex;gap:20px}
    #left{flex:1}
    #right{width:420px}
    .panel{border:1px solid #e2e6ea;padding:10px;margin-bottom:12px;background:#fff;border-radius:6px}
    button{padding:6px 10px;margin-left:6px}
    select{padding:6px}
    pre{white-space:pre-wrap;background:#fbfbfc;padding:8px;border-radius:4px}
  </style>
</head>
<body>
  <header>
    <h1>TrendIQ v2.7 — Dashboard (Solana)</h1>
    <div id="controls">
      <select id="symbolSelect"><option>SOLUSDT</option><option>RAYUSDT</option><option>SRMUSDT</option></select>
      <button id="startBtn">Start</button>
      <button id="stopBtn">Stop</button>
      <button id="openOpportunities">Opportunities</button>
    </div>
  </header>

  <div id="main">
    <div id="left">
      <div class="panel"><canvas id="scoresChart" width="800" height="300"></canvas></div>
      <div class="panel"><h3>Latest Recommendation</h3><pre id="recText">No recommendation yet</pre></div>
    </div>

    <div id="right">
      <div class="panel"><h3>Open Positions</h3><ul id="positionList"></ul></div>
      <div class="panel"><h3>Top Opportunities (live)</h3><div id="topList">No data yet</div></div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
